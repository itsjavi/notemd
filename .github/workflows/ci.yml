# Runs the core tests on pull requests and pushes to main. Releases come from release.yml (tags only).
name: Tests

on:
  pull_request:
    paths:
      ["Sources/**", "Tests/**", "Package.swift", "Package.resolved", ".github/workflows/ci.yml"]
  push:
    branches: [main]
    paths:
      ["Sources/**", "Tests/**", "Package.swift", "Package.resolved", ".github/workflows/ci.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Xcode 26 and the macOS 26 SDK.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode
        run: ./scripts/ci-select-xcode.sh
      - name: Test
        run: swift test --disable-keychain
